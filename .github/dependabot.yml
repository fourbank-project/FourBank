# managed-by: development-hq-governance
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "type:tech-debt"
      - "area:infra"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "type:tech-debt"
      - "area:security"
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
